# ===== Conexion (por defecto H2 en archivo: no requiere instalar nada) =====
db.url=jdbc:h2:file:./data/asociacion_grupo11;MODE=MySQL
db.driver=org.h2.Driver
db.username=sa
db.password=
# Alternativa MySQL (docker-compose.yml):
# db.url=jdbc:mysql://localhost:3306/asociacion?useSSL=false&allowPublicKeyRetrieval=true
# db.driver=com.mysql.cj.jdbc.Driver
# db.username=root
# db.password=root

# ===== Pool de conexiones (Tomcat JDBC) - ver justificacion en docs =====
pool.validationQuery=SELECT 1
pool.initialSize=3
pool.minIdle=3
pool.maxIdle=8
pool.maxActive=12
pool.maxWait=10000
pool.testOnBorrow=true
pool.testOnReturn=false
pool.testWhileIdle=true
pool.testOnConnect=true
pool.timeBetweenEvictionRunsMillis=30000
pool.minEvictableIdleTimeMillis=60000
pool.removeAbandoned=true
pool.removeAbandonedTimeout=60
pool.validationInterval=30000

# ===== Cierre mensual (concurrencia) =====
cierre.hilos=4
cierre.tamanoLote=2
cierre.timeoutSegundos=60
